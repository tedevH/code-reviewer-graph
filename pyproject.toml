[project]
name = "code-review-graph"
version = "0.1.0"
description = "Compile your repo into a self-updating knowledge graph and LLM wiki, then review PRs with the blast radius in view."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crg = "code_review_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_review_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
