[project]
name = "code-reviewer-graph"
version = "0.2.0"
description = "Compile any codebase into a self-updating knowledge graph, then review PRs with a team of local AI agents and a live dashboard."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "httpx>=0.27",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-language-pack>=1.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crg = "code_review_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code_review_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
